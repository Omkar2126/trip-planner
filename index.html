<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        #map {
            height: 300px;
            width: 100%;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🌍</span>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">AI Travel Planner</h1>
            </div>
            <span class="text-xs bg-green-100 text-green-800 font-semibold px-2.5 py-0.5 rounded-full">Live Pipeline Connected</span>
        </div>
    </header>

    <main class="flex-grow max-w-3xl mx-auto w-full px-4 py-8">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <label for="prompt-input" class="block text-sm font-semibold text-slate-700 mb-2">
                Where are you going? Describe your dream trip:
            </label>
            <textarea 
                id="prompt-input" 
                rows="4" 
                class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-none text-slate-700 placeholder-slate-400"
                placeholder="e.g., A 3-day food tour in Tokyo, Japan. Budget-friendly, lots of local ramen spots, and minimal walking..."
            ></textarea>
            
            <button 
                id="generate-btn"
                onclick="generateItinerary()"
                class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-sm cursor-pointer"
            >
                <span>✨ Generate Itinerary</span>
            </button>
        </div>

        <div id="loading-spinner" class="hidden flex-col items-center justify-center py-12 gap-3">
            <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-medium text-slate-500 animate-pulse">Consulting Gemini AI & mapping your route...</p>
        </div>

        <div id="result-card" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-all duration-300">
            <div class="bg-slate-900 px-6 py-4 flex items-center justify-between text-white">
                <h2 class="font-semibold flex items-center gap-2">
                    <span>🗺️</span> <span id="itinerary-title">Your Custom Travel Plan</span>
                </h2>
                <div class="flex gap-2">
                    <button id="pdf-btn" onclick="downloadPDF()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-md transition cursor-pointer font-medium">
                        📥 Download PDF
                    </button>
                    <button onclick="copyToClipboard()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded-md border border-slate-700 transition cursor-pointer">
                        Copy Text
                    </button>
                </div>
            </div>

            <div id="map" class="border-b border-slate-200 bg-slate-100"></div>

            <div id="itinerary-output" class="p-6 space-y-6"></div>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        &copy; 2026 AI Travel Planner. Powered by Render, GitHub Pages & Gemini.
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const BACKEND_URL = "https://trip-planner-gxsg.onrender.com";
        let currentTripId = null; 
        let mapInstance = null;   

        async function generateItinerary() {
            const promptInput = document.getElementById("prompt-input");
            const generateBtn = document.getElementById("generate-btn");
            const spinner = document.getElementById("loading-spinner");
            const resultCard = document.getElementById("result-card");
            const outputDiv = document.getElementById("itinerary-output");
            const titleSpan = document.getElementById("itinerary-title");

            const promptText = promptInput.value.trim();

            if (!promptText) {
                alert("Please enter a destination or description before generating!");
                return;
            }

            generateBtn.disabled = true;
            generateBtn.classList.add("opacity-50", "cursor-not-allowed");
            spinner.classList.remove("hidden");
            resultCard.classList.add("hidden");

            try {
                const response = await fetch(`${BACKEND_URL}/api/plan-trip`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt: promptText })
                });

                if (!response.ok) {
                    throw new Error(`Server returned error code: ${response.status}`);
                }

                const data = await response.json();
                console.log("Data successfully fetched from pipeline:", data);

                currentTripId = data.master_trip_id;

                if (data.payload) {
                    const trip = data.payload;
                    
                    titleSpan.innerText = `${trip.destination} (${trip.duration_days} Days) - ${trip.travel_style}`;
                    
                    let htmlBuilder = `
                        <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl text-sm text-blue-800">
                            <strong>Key Interests:</strong> ${trip.interests}<br>
                            <span class="text-xs text-slate-500">Database Coordinates Saved: ${trip.latitude}, ${trip.longitude}</span>
                        </div>
                        <div class="space-y-4">
                    `;

                    trip.daily_itinerary.forEach(day => {
                        htmlBuilder += `
                            <div class="border border-slate-200 rounded-xl p-5 shadow-xs bg-slate-50/50">
                                <div class="flex justify-between items-center border-b border-slate-200 pb-2 mb-3">
                                    <h3 class="font-bold text-lg text-blue-700">Day ${day.day_number}</h3>
                                    <span class="text-xs bg-slate-200 text-slate-700 font-medium px-2 py-0.5 rounded">Est. $${day.estimated_cost_usd}</span>
                                </div>
                                <div class="space-y-3 text-sm text-slate-700">
                                    <p><strong>🌅 Morning:</strong> ${day.morning_activity}</p>
                                    <p><strong>☀️ Afternoon:</strong> ${day.afternoon_activity}</p>
                                    <p><strong>🌙 Evening:</strong> ${day.evening_activity}</p>
                                </div>
                            </div>
                        `;
                    });

                    htmlBuilder += `</div>`;
                    outputDiv.innerHTML = htmlBuilder;

                    resultCard.classList.remove("hidden");

                    initializeMap(trip.latitude, trip.longitude, trip.destination);
                } else {
                    outputDiv.textContent = JSON.stringify(data, null, 2);
                    resultCard.classList.remove("hidden");
                }

            } catch (error) {
                console.error("Pipeline Connection Breakdown:", error);
                alert("Pipeline connection fault: " + error.message);
            } finally {
                generateBtn.disabled = false;
                generateBtn.classList.remove("opacity-50", "cursor-not-allowed");
                spinner.classList.add("hidden");
            }
        }

        function initializeMap(lat, lng, destinationName) {
            if (mapInstance) {
                mapInstance.remove();
            }

            mapInstance = L.map('map').setView([lat, lng], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(mapInstance);

            L.marker([lat, lng]).addTo(mapInstance)
                .bindPopup(`<b>${destinationName}</b><br>AI Target Base Coordinate Saved.`)
                .openPopup();
            
            setTimeout(() => { mapInstance.invalidateSize(); }, 200);
        }

        async function downloadPDF() {
            if (!currentTripId) {
                alert("No active trip profile located to compile PDF extraction.");
                return;
            }

            const pdfBtn = document.getElementById("pdf-btn");
            pdfBtn.innerText = "⏳ Building PDF...";
            pdfBtn.disabled = true;

            try {
                window.location.href = `${BACKEND_URL}/api/itinerary/${currentTripId}/export`;
            } catch (err) {
                console.error(err);
                alert("Error compilation downloading target document registry binary structure.");
            } finally {
                setTimeout(() => {
                    pdfBtn.innerText = "📥 Download PDF";
                    pdfBtn.disabled = false;
                }, 2000);
            }
        }

        function copyToClipboard() {
            const text = document.getElementById("itinerary-output").innerText;
            navigator.clipboard.writeText(text);
            alert("Itinerary layout text copied to clipboard! 📋");
        }
    </script>
</body>
</html>
